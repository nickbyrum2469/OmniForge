name: Targeted Phase 0 migration diagnostics

on:
  pull_request:
    branches:
      - milestone-12-1/celestial-path-terrain-corrections
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'phase0/celestial-authority-stabilization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase0/celestial-authority-stabilization
          fetch-depth: 0
      - name: Run migration and preserve exact failure
        id: migration
        shell: bash
        run: |
          set +e
          {
            python3 scripts/apply-phase0-celestial-stabilization.py
            python3 scripts/apply-phase0-authority-followup.py
          } > PHASE0_MIGRATION_OUTPUT.txt 2>&1
          status=$?
          cat PHASE0_MIGRATION_OUTPUT.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit failure evidence
        if: steps.migration.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE0_MIGRATION_OUTPUT.txt
          git commit -m "Record Phase 0 migration failure"
          git push origin HEAD:phase0/celestial-authority-stabilization
      - name: Fail after evidence capture
        if: steps.migration.outputs.status != '0'
        run: exit 1
