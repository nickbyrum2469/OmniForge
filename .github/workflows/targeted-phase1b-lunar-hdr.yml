name: Targeted Phase 1B Lunar HDR runner

on:
  push:
    branches:
      - phase1b/lunar-cycle-hdr-lighting-presets
  pull_request:
    branches:
      - phase1/linear-hdr-rendergraph-lighting-core
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: targeted-phase1b-lunar-hdr
  cancel-in-progress: true

jobs:
  source:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'phase1b/lunar-cycle-hdr-lighting-presets')
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.finalize.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1b/lunar-cycle-hdr-lighting-presets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Apply Phase 1B source integration
        run: |
          python3 scripts/apply-phase1b-lunar-hdr.py
          python3 scripts/apply-phase1b-followup.py
      - name: Syntax checks
        run: |
          node --check app/celestial-mechanics.js
          node --check app/environment-presets.js
          node --check app/environment-runtime.js
          node --check app/hdr-pipeline.js
          node --check app/sky-pass.js
          node --check app/renderer.js
          node --check app/v010.js
          node --check server/v010-systems.mjs
          node --check server/v010-api.mjs
      - name: Complete automated tests
        shell: bash
        run: set -o pipefail; npm test 2>&1 | tee PHASE1B_TEST_OUTPUT.txt
      - name: Repository verification
        run: npm run verify
      - name: Idempotency
        shell: bash
        run: |
          git diff > /tmp/before.diff
          python3 scripts/apply-phase1b-lunar-hdr.py
          python3 scripts/apply-phase1b-followup.py
          git diff > /tmp/after.diff
          diff -u /tmp/before.diff /tmp/after.diff
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phase1B-source-evidence-${{ github.run_id }}
          path: PHASE1B_TEST_OUTPUT.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Commit verified source
        id: finalize
        shell: bash
        run: |
          rm -f PHASE1B_TEST_OUTPUT.txt WINDOWS_VERIFY_ERROR.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add app server
            git add -u PHASE1B_TEST_OUTPUT.txt WINDOWS_VERIFY_ERROR.txt || true
            git commit -m "Add independent lunar cycles, HDR display, starfields, and lighting presets"
            git push origin HEAD:phase1b/lunar-cycle-hdr-lighting-presets
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        shell: pwsh
        run: if (Test-Path package-lock.json) { npm ci } else { npm install --no-audit --no-fund }
      - name: Windows tests and verification
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Phase 1B Windows tests failed.' }
          npm run verify
          if ($LASTEXITCODE -ne 0) { throw 'Phase 1B Windows verification failed.' }
      - name: Build native package
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\BUILD_DESKTOP_WINDOWS.ps1
      - name: Audit exact package identity
        shell: pwsh
        run: |
          $output=Join-Path $PWD 'dist\OmniForge-win32-x64'
          $required=@('OmniForge.exe','source-commit','resources\app\app\renderer.js','resources\app\app\render-graph.js','resources\app\app\frame-resources.js','resources\app\app\hdr-pipeline.js','resources\app\app\celestial-mechanics.js','resources\app\app\environment-presets.js','resources\app\app\sky-pass.js','resources\app\server\v010-systems.mjs')
          foreach($relative in $required){if(-not(Test-Path (Join-Path $output $relative) -PathType Leaf)){throw "Missing packaged Phase 1B file: $relative"}}
          $sourceCommit=(Get-Content (Join-Path $output 'source-commit') -Raw).Trim()
          $head=(git rev-parse HEAD).Trim()
          if($sourceCommit -ne $head){throw "Packaged source $sourceCommit does not match checkout $head."}
          if($head -ne '${{ needs.source.outputs.commit_sha }}'){throw 'Package was not built from the verified Phase 1B SHA.'}
      - name: Packaged lunar and HDR smoke
        shell: pwsh
        run: |
          $output=Join-Path $PWD 'dist\OmniForge-win32-x64'
          $runtime=Join-Path $env:TEMP "omniforge-phase1b-final-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $port=43143
          $env:OMNIFORGE_DATA_ROOT=$runtime
          $env:OMNIFORGE_PORT="$port"
          $process=$null
          try {
            $process=Start-Process -FilePath (Join-Path $output 'OmniForge.exe') -PassThru
            $deadline=(Get-Date).AddSeconds(45);$healthy=$false
            while((Get-Date)-lt $deadline){Start-Sleep -Milliseconds 400;try{Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2|Out-Null;$healthy=$true;break}catch{}}
            if(-not $healthy){throw 'Packaged Phase 1B editor did not become healthy.'}
            $world=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/v010/world" -TimeoutSec 8
            $scene=$world.scene
            $sun=@($scene.objects|Where-Object{$_.properties.celestialRole -eq 'sun'})
            $moon=@($scene.objects|Where-Object{$_.properties.celestialRole -eq 'moon'})
            if($sun.Count -ne 1 -or $moon.Count -ne 1){throw "Celestial regression: Sun=$($sun.Count), Moon=$($moon.Count)."}
            if($moon[0].properties.phaseName -eq $null -or $moon[0].properties.ageDays -eq $null){throw 'Lunar phase metadata is missing.'}
            $body=@{sky=@{eclipseMode='force-lunar';moonPhaseMode='sun-relative';starTwinkleAmount=0.8;starSizeMax=2.5;milkyWayWidth=0.12};atmosphere=@{saturation=1.15;contrast=1.08;vibrance=0.2;toneMapper='aces'}}|ConvertTo-Json -Depth 8
            $updated=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/v010/world" -Method Patch -ContentType 'application/json' -Body $body -TimeoutSec 8
            $active=$updated.state.scenes|Where-Object{$_.id -eq $updated.state.activeSceneId}|Select-Object -First 1
            $updatedMoon=$active.objects|Where-Object{$_.properties.celestialRole -eq 'moon'}|Select-Object -First 1
            if($updatedMoon.properties.eventType -ne 'lunar-eclipse' -or $updatedMoon.properties.lunarEclipse -lt 0.99){throw 'Forced lunar eclipse did not reach the Moon authority.'}
            Start-Sleep -Seconds 4
            if($process.HasExited){throw 'Editor exited during HDR or sky initialization.'}
          } finally {
            if($process -and -not $process.HasExited){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
            Get-Process OmniForge -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item Env:OMNIFORGE_DATA_ROOT -ErrorAction SilentlyContinue
            Remove-Item Env:OMNIFORGE_PORT -ErrorAction SilentlyContinue
            Remove-Item $runtime -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Archive package and evidence
        shell: pwsh
        run: |
          $archive='OmniForge-Phase1B-Lunar-HDR-Windows-x64.zip'
          if(Test-Path $archive){Remove-Item $archive -Force}
          Compress-Archive -Path '.\dist\OmniForge-win32-x64\*' -DestinationPath $archive -CompressionLevel Optimal
          $hash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive"|Set-Content 'OmniForge-Phase1B-Lunar-HDR-Windows-x64.sha256' -Encoding ascii
          @('Phase 1B final Windows evidence','Source commit: ${{ needs.source.outputs.commit_sha }}',"Archive SHA-256: $hash",'Tests: passed','Verification: passed','Package audit: passed','Lunar orbit/phase/eclipse smoke: passed','HDR and sky startup smoke: passed')|Set-Content 'PHASE1B_WINDOWS_EVIDENCE.txt' -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: OmniForge-Phase1B-Lunar-HDR-${{ github.run_id }}
          path: |
            OmniForge-Phase1B-Lunar-HDR-Windows-x64.zip
            OmniForge-Phase1B-Lunar-HDR-Windows-x64.sha256
            PHASE1B_WINDOWS_EVIDENCE.txt
          if-no-files-found: error
          retention-days: 30
