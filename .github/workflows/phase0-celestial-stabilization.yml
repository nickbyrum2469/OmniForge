name: Phase 0 Celestial Stabilization

on:
  push:
    branches:
      - phase0/celestial-authority-stabilization
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase0-celestial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.finalize.outputs.commit_sha }}
    steps:
      - name: Check out exact Phase 0 branch
        uses: actions/checkout@v4
        with:
          ref: phase0/celestial-authority-stabilization
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Apply deterministic Phase 0A-D source migration
        run: |
          python3 scripts/apply-phase0-celestial-stabilization.py
          python3 scripts/apply-phase0-authority-followup.py

      - name: Check modified source syntax
        run: |
          node --check server/celestial-authority.mjs
          node --check server/v010-systems.mjs
          node --check server/v010-api.mjs
          node --check server/server.mjs
          node --check app/world-runtime.js
          node --check app/v010.js
          node --check app/app.js

      - name: Run complete automated suite
        run: npm test

      - name: Run repository verification
        run: npm run verify

      - name: Commit only verified Phase 0 source
        id: finalize
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add app server
            git commit -m "Complete Phase 0 celestial authority and smooth runtime stabilization"
            git push origin HEAD:phase0/celestial-authority-stabilization
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Verified Phase 0 source commit: $(git rev-parse HEAD)"

  package-windows:
    needs: integrate-and-verify
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact verified Phase 0 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate-and-verify.outputs.commit_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install --no-audit --no-fund }

      - name: Re-run tests and repository verification on Windows
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Phase 0 Windows tests failed.' }
          npm run verify
          if ($LASTEXITCODE -ne 0) { throw 'Phase 0 Windows repository verification failed.' }

      - name: Build native Windows desktop package
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\BUILD_DESKTOP_WINDOWS.ps1

      - name: Audit packaged Phase 0 authority
        shell: pwsh
        run: |
          $output=Join-Path $PWD 'dist\OmniForge-win32-x64'
          $required=@(
            'OmniForge.exe',
            'version',
            'source-commit',
            'resources\app\server\celestial-authority.mjs',
            'resources\app\server\v010-systems.mjs',
            'resources\app\server\v010-api.mjs',
            'resources\app\server\server.mjs',
            'resources\app\app\world-runtime.js',
            'resources\app\app\v010.js',
            'resources\app\app\app.js'
          )
          foreach($relative in $required){
            if(-not(Test-Path (Join-Path $output $relative) -PathType Leaf)){throw "Packaged Phase 0 file is missing: $relative"}
          }
          $sourceCommit=(Get-Content (Join-Path $output 'source-commit') -Raw).Trim()
          $checkedOutCommit=(git rev-parse HEAD).Trim()
          if($sourceCommit -ne $checkedOutCommit){throw "Packaged source commit $sourceCommit does not match $checkedOutCommit."}
          if($checkedOutCommit -ne '${{ needs.integrate-and-verify.outputs.commit_sha }}'){throw 'Windows checkout is not the verified Phase 0 source commit.'}

      - name: Smoke-test persistent celestial identity and legacy deduplication
        shell: pwsh
        run: |
          $output=Join-Path $PWD 'dist\OmniForge-win32-x64'
          $runtime=Join-Path $env:TEMP "omniforge-phase0-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $port=43131
          $env:OMNIFORGE_DATA_ROOT=$runtime
          $env:OMNIFORGE_PORT="$port"

          function Wait-Health {
            param([int]$Port)
            $deadline=(Get-Date).AddSeconds(35)
            while((Get-Date)-lt $deadline){
              Start-Sleep -Milliseconds 400
              try{return Invoke-RestMethod -Uri "http://127.0.0.1:$Port/api/health" -TimeoutSec 2}catch{}
            }
            throw 'Packaged Phase 0 executable did not become healthy.'
          }

          function Assert-CelestialAuthority {
            param($State)
            $scene=$State.scenes | Where-Object { $_.id -eq $State.activeSceneId } | Select-Object -First 1
            $suns=@($scene.objects | Where-Object { $_.properties.celestialRole -eq 'sun' })
            $moons=@($scene.objects | Where-Object { $_.properties.celestialRole -eq 'moon' })
            if($suns.Count -ne 1){throw "Expected one authoritative Sun; found $($suns.Count)."}
            if($moons.Count -ne 1){throw "Expected one authoritative Moon; found $($moons.Count)."}
            if(-not $suns[0].properties.celestialProxy -or -not $moons[0].properties.celestialProxy){throw 'Celestial proxies are not marked authoritative.'}
            if(-not $suns[0].locked -or -not $moons[0].locked){throw 'Celestial proxies are not protected.'}
            return @{ Sun=$suns[0]; Moon=$moons[0] }
          }

          $process=$null
          try {
            $process=Start-Process -FilePath (Join-Path $output 'OmniForge.exe') -PassThru
            Wait-Health -Port $port | Out-Null
            $state=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/state" -TimeoutSec 8
            $authority=Assert-CelestialAuthority -State $state

            $duplicateBody=@{type='directionalLight';name='Sun';position=@(0,15,0)} | ConvertTo-Json -Depth 8
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$port/api/object" -ContentType 'application/json' -Body $duplicateBody -TimeoutSec 8 | Out-Null
            $world=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/v010/world" -TimeoutSec 8
            $authority=Assert-CelestialAuthority -State $world.state

            foreach($object in @($authority.Sun,$authority.Moon)){
              $selectionBody=@{objectId=$object.id} | ConvertTo-Json
              Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$port/api/selection" -ContentType 'application/json' -Body $selectionBody -TimeoutSec 8 | Out-Null
            }

            $duplicateRejected=$false
            try {
              $body=@{objectId=$authority.Moon.id} | ConvertTo-Json
              Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$port/api/object/duplicate" -ContentType 'application/json' -Body $body -TimeoutSec 8 | Out-Null
            } catch { $duplicateRejected=$true }
            if(-not $duplicateRejected){throw 'Moon duplication was not rejected.'}

            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $process=$null
            Start-Sleep -Milliseconds 700
            $process=Start-Process -FilePath (Join-Path $output 'OmniForge.exe') -PassThru
            Wait-Health -Port $port | Out-Null
            $reloaded=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/state" -TimeoutSec 8
            $reloadedAuthority=Assert-CelestialAuthority -State $reloaded
            $selectionBody=@{objectId=$reloadedAuthority.Moon.id} | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$port/api/selection" -ContentType 'application/json' -Body $selectionBody -TimeoutSec 8 | Out-Null
            Write-Host 'Phase 0 packaged authority, duplicate cleanup, Moon selection, and restart persistence passed.'
          } finally {
            if($process -and -not $process.HasExited){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
            Get-Process OmniForge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item Env:OMNIFORGE_DATA_ROOT -ErrorAction SilentlyContinue
            Remove-Item Env:OMNIFORGE_PORT -ErrorAction SilentlyContinue
            Remove-Item $runtime -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Create portable archive and checksum
        shell: pwsh
        run: |
          $archive=Join-Path $PWD 'OmniForge-Phase0-Celestial-Stabilization-Windows-x64.zip'
          if(Test-Path $archive){Remove-Item $archive -Force}
          Compress-Archive -Path '.\dist\OmniForge-win32-x64\*' -DestinationPath $archive -CompressionLevel Optimal
          $hash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OmniForge-Phase0-Celestial-Stabilization-Windows-x64.zip" | Set-Content '.\OmniForge-Phase0-Celestial-Stabilization-Windows-x64.sha256' -Encoding ascii
          Write-Host "Archive SHA-256: $hash"

      - name: Upload Phase 0 Windows package
        uses: actions/upload-artifact@v4
        with:
          name: OmniForge-Phase0-Celestial-Stabilization-${{ github.run_id }}
          path: |
            OmniForge-Phase0-Celestial-Stabilization-Windows-x64.zip
            OmniForge-Phase0-Celestial-Stabilization-Windows-x64.sha256
          if-no-files-found: error
          retention-days: 30
