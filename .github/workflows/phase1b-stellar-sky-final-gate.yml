name: Phase 1B Stellar Sky Final Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase1b-stellar-sky-final-gate
  cancel-in-progress: true

jobs:
  source:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'phase1b/stellar-sky-authoring')
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.finalize.outputs.commit_sha }}
    steps:
      - name: Check out exact stellar sky branch
        uses: actions/checkout@v4
        with:
          ref: phase1b/stellar-sky-authoring
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Apply deterministic stellar sky migration
        run: python3 scripts/apply-phase1b-stellar-sky-v2.py

      - name: Check modified source syntax
        run: |
          node --check app/sky-pass.js
          node --check app/environment-runtime.js
          node --check app/v010.js
          node --check server/v010-systems.mjs

      - name: Run complete automated suite
        run: npm test

      - name: Run repository verification
        run: npm run verify

      - name: Prove stellar migration idempotency
        run: |
          git diff -- app/sky-pass.js app/environment-runtime.js app/v010.js server/v010-systems.mjs > /tmp/stellar-before.diff
          python3 scripts/apply-phase1b-stellar-sky-v2.py
          git diff -- app/sky-pass.js app/environment-runtime.js app/v010.js server/v010-systems.mjs > /tmp/stellar-after.diff
          diff -u /tmp/stellar-before.diff /tmp/stellar-after.diff

      - name: Commit only verified stellar source
        id: finalize
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add app/sky-pass.js app/environment-runtime.js app/v010.js server/v010-systems.mjs
            git commit -m "Add authored stellar field, structured Milky Way, and separate aurora"
            git push origin HEAD:phase1b/stellar-sky-authoring
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Check out exact verified stellar source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        shell: pwsh
        run: if (Test-Path package-lock.json) { npm ci } else { npm install --no-audit --no-fund }

      - name: Re-run complete tests and verification on Windows
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Phase 1B Windows tests failed.' }
          npm run verify
          if ($LASTEXITCODE -ne 0) { throw 'Phase 1B Windows verification failed.' }

      - name: Build native Windows package
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\BUILD_DESKTOP_WINDOWS.ps1

      - name: Audit exact package identity and stellar files
        shell: pwsh
        run: |
          $output=Join-Path $PWD 'dist\OmniForge-win32-x64'
          $required=@(
            'OmniForge.exe',
            'source-commit',
            'resources\app\app\sky-pass.js',
            'resources\app\app\environment-runtime.js',
            'resources\app\app\v010.js',
            'resources\app\server\v010-systems.mjs',
            'resources\app\docs\PHASE_1B_STELLAR_SKY_AUTHORING.md'
          )
          foreach($relative in $required){
            if(-not(Test-Path (Join-Path $output $relative) -PathType Leaf)){throw "Missing packaged stellar file: $relative"}
          }
          $source=(Get-Content (Join-Path $output 'source-commit') -Raw).Trim()
          if($source -ne '${{ needs.source.outputs.commit_sha }}'){throw "Package source $source is not the verified stellar source."}

      - name: Smoke-test packaged stellar persistence and celestial authority
        shell: pwsh
        run: |
          $output=Join-Path $PWD 'dist\OmniForge-win32-x64'
          $runtime=Join-Path $env:TEMP "omniforge-phase1b-stellar-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $port=43144
          $env:OMNIFORGE_DATA_ROOT=$runtime
          $env:OMNIFORGE_PORT="$port"
          $process=$null

          function Wait-Health {
            $deadline=(Get-Date).AddSeconds(40)
            while((Get-Date)-lt $deadline){
              Start-Sleep -Milliseconds 400
              try { Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2 | Out-Null; return } catch {}
            }
            throw 'Packaged stellar build did not become healthy.'
          }

          function Assert-Authority($state) {
            $scene=$state.scenes|Where-Object{$_.id -eq $state.activeSceneId}|Select-Object -First 1
            if(-not $scene){throw 'Active scene missing.'}
            $suns=@($scene.objects|Where-Object{$_.properties.celestialRole -eq 'sun'})
            $moons=@($scene.objects|Where-Object{$_.properties.celestialRole -eq 'moon'})
            if($suns.Count -ne 1 -or $moons.Count -ne 1){throw "Celestial authority regressed: Sun=$($suns.Count), Moon=$($moons.Count)."}
          }

          try {
            $process=Start-Process -FilePath (Join-Path $output 'OmniForge.exe') -PassThru
            Wait-Health
            $state=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/state" -TimeoutSec 8
            Assert-Authority $state
            $payload=@{
              time=@{hours=1;enabled=$false}
              sky=@{
                starIntensity=1.7;starDensity=1.31;starSizeMin=0.8;starSizeMax=4.2
                starBrightnessVariation=0.73;starColorVariation=0.61;starTwinkleAmount=0.84;starTwinkleSpeed=2.6
                starSeed=7788;starRotation=37;starHorizonFade=0.24;starWarmColor='#ffcc99';starCoolColor='#99bbff'
                milkyWayIntensity=1.25;milkyWayWidth=22;milkyWayDetail=1.8;milkyWayDust=0.77;milkyWayCore=1.15
                milkyWayAzimuth=112;milkyWayElevation=51;milkyWayRotation=-28;milkyWayColor='#687eb3';milkyWayCoreColor='#e6c9a2'
                auroraIntensity=0.63;auroraColor='#55efbc';auroraSecondaryColor='#7766ff';auroraSpeed=0.82;auroraScale=1.7
              }
            }|ConvertTo-Json -Depth 8
            Invoke-RestMethod -Method Patch -Uri "http://127.0.0.1:$port/api/v010/world" -ContentType 'application/json' -Body $payload -TimeoutSec 10 | Out-Null
            $world=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/v010/world" -TimeoutSec 8
            if([double]$world.world.sky.starSizeMax -ne 4.2){throw 'Star size did not persist.'}
            if([double]$world.world.sky.starTwinkleSpeed -ne 2.6){throw 'Twinkle speed did not persist.'}
            if([double]$world.world.sky.milkyWayDust -ne 0.77){throw 'Milky Way dust did not persist.'}
            if([string]$world.world.sky.milkyWayCoreColor -ne '#e6c9a2'){throw 'Milky Way core color did not persist.'}
            if([double]$world.world.sky.auroraIntensity -ne 0.63){throw 'Aurora intensity did not persist.'}
            Assert-Authority $world.state

            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $process=$null
            Start-Sleep -Milliseconds 700
            $process=Start-Process -FilePath (Join-Path $output 'OmniForge.exe') -PassThru
            Wait-Health
            $reloaded=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/v010/world" -TimeoutSec 8
            if([int]$reloaded.world.sky.starSeed -ne 7788){throw 'Star seed did not survive restart.'}
            if([double]$reloaded.world.sky.milkyWayWidth -ne 22){throw 'Milky Way width did not survive restart.'}
            if([double]$reloaded.world.sky.auroraScale -ne 1.7){throw 'Aurora scale did not survive restart.'}
            Assert-Authority $reloaded.state
            Start-Sleep -Seconds 3
            if($process.HasExited){throw 'Packaged stellar editor exited during renderer initialization.'}
          } finally {
            if($process -and -not $process.HasExited){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
            Get-Process OmniForge -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item Env:OMNIFORGE_DATA_ROOT -ErrorAction SilentlyContinue
            Remove-Item Env:OMNIFORGE_PORT -ErrorAction SilentlyContinue
            Remove-Item $runtime -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Archive exact stellar package and evidence
        id: archive
        shell: pwsh
        run: |
          $archive='OmniForge-Phase1B-Stellar-Sky-Windows-x64.zip'
          if(Test-Path $archive){Remove-Item $archive -Force}
          Compress-Archive -Path '.\dist\OmniForge-win32-x64\*' -DestinationPath $archive -CompressionLevel Optimal
          $hash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive"|Set-Content 'OmniForge-Phase1B-Stellar-Sky-Windows-x64.sha256' -Encoding ascii
          @(
            'Phase 1B Stellar Sky Windows evidence',
            'Source commit: ${{ needs.source.outputs.commit_sha }}',
            "Archive SHA-256: $hash",
            'Linux and Windows tests: passed',
            'Repository verification: passed',
            'Package identity: passed',
            'Stellar settings persistence and restart: passed',
            'Phase 0 celestial authority: passed'
          )|Set-Content 'PHASE1B_STELLAR_WINDOWS_EVIDENCE.txt' -Encoding utf8
          "archive_hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload verified stellar package
        uses: actions/upload-artifact@v4
        with:
          name: OmniForge-Phase1B-Stellar-Sky-${{ github.run_id }}
          path: |
            OmniForge-Phase1B-Stellar-Sky-Windows-x64.zip
            OmniForge-Phase1B-Stellar-Sky-Windows-x64.sha256
            PHASE1B_STELLAR_WINDOWS_EVIDENCE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Record successful Windows stellar gate
        shell: pwsh
        run: |
          git fetch origin phase1b/stellar-sky-authoring
          git switch phase1b/stellar-sky-authoring
          git pull --ff-only origin phase1b/stellar-sky-authoring
          @(
            '# Phase 1B Stellar Sky Windows Verification','',
            '- Verified source commit: `${{ needs.source.outputs.commit_sha }}`',
            '- Workflow run: `${{ github.run_id }}`',
            '- Archive SHA-256: `${{ steps.archive.outputs.archive_hash }}`',
            '- Complete Linux and Windows tests: passed',
            '- Repository verification: passed',
            '- Native package identity and startup: passed',
            '- Stellar authoring persistence and restart: passed',
            '- Phase 0 Sun/Moon authority: passed','',
            'Direct target-PC visual acceptance remains the final merge gate.'
          )|Set-Content 'docs\PHASE_1B_STELLAR_WINDOWS_VERIFIED.md' -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE_1B_STELLAR_WINDOWS_VERIFIED.md
          if(-not(git diff --cached --quiet)){git commit -m 'Record successful Phase 1B stellar Windows verification';git push origin HEAD:phase1b/stellar-sky-authoring}
