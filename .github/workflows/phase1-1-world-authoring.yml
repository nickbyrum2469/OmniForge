name: Phase 1.1 World Authoring Corrections

on:
  push:
    branches:
      - milestone-12-1/celestial-path-terrain-corrections
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: milestone-12-1/celestial-path-terrain-corrections
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply Phase 1.1 corrections
        run: python3 scripts/apply-phase1-1-world-authoring.py

      - name: Run complete automated tests
        run: npm test

      - name: Run repository verification
        run: npm run verify

      - name: Commit verified corrective source
        shell: bash
        run: |
          rm -f PHASE1_1_OUTPUT.txt
          if git diff --quiet; then
            echo "Phase 1.1 source is already integrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app server
          git commit -m "Add celestial controls, volumetric clouds, path tools, and local terrain sculpting"
          git push origin HEAD:milestone-12-1/celestial-path-terrain-corrections

# Final user-authored validation trigger after all source and sculpt routes landed.
