name: Targeted Phase 1.1 world authoring runner

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-phase1-1:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'milestone-12-1/celestial-path-terrain-corrections')
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: milestone-12-1/celestial-path-terrain-corrections
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply corrective migration
        id: apply
        shell: bash
        run: |
          set +e
          {
            python3 scripts/apply-phase1-1-world-authoring.py
            python3 scripts/cleanup-phase1-1-sculpt-routes.py
          } > PHASE1_1_OUTPUT.txt 2>&1
          status=$?
          cat PHASE1_1_OUTPUT.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record migration failure
        if: steps.apply.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE1_1_OUTPUT.txt
          git commit -m "Record Phase 1.1 migration failure"
          git push origin HEAD:milestone-12-1/celestial-path-terrain-corrections

      - name: Stop after migration failure
        if: steps.apply.outputs.status != '0'
        run: exit 1

      - name: Run complete automated tests
        if: steps.apply.outputs.status == '0'
        run: npm test

      - name: Run repository verification
        if: steps.apply.outputs.status == '0'
        run: npm run verify

      - name: Commit verified source
        if: steps.apply.outputs.status == '0'
        shell: bash
        run: |
          rm -f PHASE1_1_OUTPUT.txt
          if git diff --quiet; then
            echo "Corrective source is already integrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app server
          git commit -m "Finalize celestial, cloud, path, and terrain authoring corrections"
          git push origin HEAD:milestone-12-1/celestial-path-terrain-corrections
