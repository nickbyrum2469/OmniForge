name: Phase 1A PR Final Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase1a-pr-final-gate
  cancel-in-progress: true

jobs:
  source:
    if: github.event_name != 'pull_request' || github.head_ref == 'phase1/linear-hdr-rendergraph-lighting-core'
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
    steps:
      - name: Check out exact Phase 1A branch
        uses: actions/checkout@v4
        with:
          ref: phase1/linear-hdr-rendergraph-lighting-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Prove deterministic migration is integrated
        run: |
          python3 scripts/apply-phase1a-rendergraph.py
          git diff --exit-code -- app/renderer.js
      - name: Check syntax
        run: |
          node --check app/render-graph.js
          node --check app/frame-resources.js
          node --check app/renderer.js
      - name: Run complete tests and verification
        run: |
          npm test
          npm run verify
      - name: Record verified identity
        id: identity
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        shell: pwsh
        run: if (Test-Path package-lock.json) { npm ci } else { npm install --no-audit --no-fund }
      - name: Re-run tests and verification on Windows
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed.' }
          npm run verify
          if ($LASTEXITCODE -ne 0) { throw 'Windows verification failed.' }
      - name: Build native Windows package
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\BUILD_DESKTOP_WINDOWS.ps1
      - name: Audit package identity and required graph files
        shell: pwsh
        run: |
          $output=Join-Path $PWD 'dist\OmniForge-win32-x64'
          foreach($relative in @('OmniForge.exe','source-commit','resources\app\app\renderer.js','resources\app\app\render-graph.js','resources\app\app\frame-resources.js')){
            if(-not(Test-Path (Join-Path $output $relative) -PathType Leaf)){throw "Missing $relative"}
          }
          $source=(Get-Content (Join-Path $output 'source-commit') -Raw).Trim()
          if($source -ne '${{ needs.source.outputs.commit_sha }}'){throw "Package source $source is not the verified source."}
      - name: Smoke-test packaged startup and retained celestial authority
        shell: pwsh
        run: |
          $output=Join-Path $PWD 'dist\OmniForge-win32-x64'
          $runtime=Join-Path $env:TEMP "omniforge-phase1a-pr-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $port=43143;$env:OMNIFORGE_DATA_ROOT=$runtime;$env:OMNIFORGE_PORT="$port";$process=$null
          try {
            $process=Start-Process -FilePath (Join-Path $output 'OmniForge.exe') -PassThru
            $deadline=(Get-Date).AddSeconds(40);$healthy=$false
            while((Get-Date)-lt $deadline){Start-Sleep -Milliseconds 400;try{Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2|Out-Null;$healthy=$true;break}catch{}}
            if(-not $healthy){throw 'Packaged editor did not become healthy.'}
            $state=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/state" -TimeoutSec 8
            $scene=$state.scenes|Where-Object{$_.id -eq $state.activeSceneId}|Select-Object -First 1
            $suns=@($scene.objects|Where-Object{$_.properties.celestialRole -eq 'sun'});$moons=@($scene.objects|Where-Object{$_.properties.celestialRole -eq 'moon'})
            if($suns.Count -ne 1 -or $moons.Count -ne 1){throw "Celestial authority regressed: Sun=$($suns.Count), Moon=$($moons.Count)."}
            Start-Sleep -Seconds 3
            if($process.HasExited){throw 'Editor exited during renderer initialization.'}
          } finally {
            if($process -and -not $process.HasExited){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
            Get-Process OmniForge -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item Env:OMNIFORGE_DATA_ROOT -ErrorAction SilentlyContinue;Remove-Item Env:OMNIFORGE_PORT -ErrorAction SilentlyContinue;Remove-Item $runtime -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Archive exact package and evidence
        id: archive
        shell: pwsh
        run: |
          $archive='OmniForge-Phase1A-RenderGraph-Windows-x64.zip'
          Compress-Archive -Path '.\dist\OmniForge-win32-x64\*' -DestinationPath $archive -CompressionLevel Optimal
          $hash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive"|Set-Content 'OmniForge-Phase1A-RenderGraph-Windows-x64.sha256' -Encoding ascii
          @("Phase 1A PR final evidence","Source commit: ${{ needs.source.outputs.commit_sha }}","Archive SHA-256: $hash","Linux source gate: passed","Windows source gate: passed","Package identity: passed","Packaged startup: passed")|Set-Content 'PHASE1A_WINDOWS_EVIDENCE.txt' -Encoding utf8
          "archive_hash=$hash" >> $env:GITHUB_OUTPUT
      - name: Upload Phase 1A package
        uses: actions/upload-artifact@v4
        with:
          name: OmniForge-Phase1A-RenderGraph-${{ github.run_id }}
          path: |
            OmniForge-Phase1A-RenderGraph-Windows-x64.zip
            OmniForge-Phase1A-RenderGraph-Windows-x64.sha256
            PHASE1A_WINDOWS_EVIDENCE.txt
          if-no-files-found: error
          retention-days: 30
      - name: Record successful gate on feature branch
        shell: pwsh
        run: |
          git fetch origin phase1/linear-hdr-rendergraph-lighting-core
          git switch phase1/linear-hdr-rendergraph-lighting-core
          git pull --ff-only origin phase1/linear-hdr-rendergraph-lighting-core
          @(
            '# Phase 1A Windows Verification','',
            '- Verified source commit: `${{ needs.source.outputs.commit_sha }}`',
            '- Workflow run: `${{ github.run_id }}`',
            '- Archive SHA-256: `${{ steps.archive.outputs.archive_hash }}`',
            '- Complete Linux and Windows tests: passed',
            '- Repository verification: passed',
            '- Package identity and startup: passed','',
            'Direct target-PC viewport acceptance remains the final merge gate.'
          )|Set-Content 'docs\PHASE_1A_WINDOWS_VERIFIED.md' -Encoding utf8
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE_1A_WINDOWS_VERIFIED.md
          if(-not(git diff --cached --quiet)){git commit -m 'Record successful Phase 1A Windows verification';git push origin HEAD:phase1/linear-hdr-rendergraph-lighting-core}
