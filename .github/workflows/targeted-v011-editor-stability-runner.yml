name: Targeted v0.11 editor stability repair

on:
  push:
    branches:
      - fix/v011-editor-freeze-night-visibility

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out dedicated repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/v011-editor-freeze-night-visibility
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply deterministic source repair
        run: node scripts/apply-v011-editor-stability-fix.mjs

      - name: Run full automated tests
        run: npm test

      - name: Run repository verification
        run: npm run verify

      - name: Commit verified production repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Production repair is already applied."
            exit 0
          fi
          git config user.name "OmniForge CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            BUILD_DESKTOP_WINDOWS.ps1 \
            app/app.js \
            app/renderer.js \
            app/v010.js \
            app/v011.js \
            app/world-runtime.js \
            desktop/main.cjs \
            server/v010-api.mjs \
            server/v011-api.mjs \
            tests/editor-runtime-stability.test.mjs \
            tests/v010.test.mjs
          git commit -m "Fix editor runtime stalls and night visibility"
          git push origin HEAD:fix/v011-editor-freeze-night-visibility
