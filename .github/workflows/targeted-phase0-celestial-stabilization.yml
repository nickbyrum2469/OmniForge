name: Targeted Phase 0 celestial stabilization

on:
  pull_request:
    branches:
      - milestone-12-1/celestial-path-terrain-corrections
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: targeted-phase0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'phase0/celestial-authority-stabilization'
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.finalize.outputs.commit_sha }}
    steps:
      - name: Check out Phase 0 source branch
        uses: actions/checkout@v4
        with:
          ref: phase0/celestial-authority-stabilization
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Apply expanded Phase 0A-D migrations
        run: |
          python3 scripts/apply-phase0-celestial-stabilization.py
          python3 scripts/apply-phase0-authority-followup.py

      - name: Check modified source syntax
        run: |
          node --check server/celestial-authority.mjs
          node --check server/v010-systems.mjs
          node --check server/v010-api.mjs
          node --check server/server.mjs
          node --check app/world-runtime.js
          node --check app/v010.js
          node --check app/app.js

      - name: Run complete test suite
        run: npm test

      - name: Run repository verification
        run: npm run verify

      - name: Commit only verified Phase 0 source
        id: finalize
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add app server
            git commit -m "Complete Phase 0 celestial authority and smooth runtime stabilization"
            git pull --rebase origin phase0/celestial-authority-stabilization
            git push origin HEAD:phase0/celestial-authority-stabilization
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Verified source: $(git rev-parse HEAD)"

  package-windows:
    needs: integrate-and-verify
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate-and-verify.outputs.commit_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install --no-audit --no-fund }

      - name: Re-run tests and verification on Windows
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Phase 0 Windows tests failed.' }
          npm run verify
          if ($LASTEXITCODE -ne 0) { throw 'Phase 0 Windows verification failed.' }

      - name: Build native Windows package
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\BUILD_DESKTOP_WINDOWS.ps1

      - name: Audit package identity and Phase 0 files
        shell: pwsh
        run: |
          $output=Join-Path $PWD 'dist\OmniForge-win32-x64'
          $required=@(
            'OmniForge.exe','source-commit','version',
            'resources\app\server\celestial-authority.mjs',
            'resources\app\server\v010-systems.mjs',
            'resources\app\server\v010-api.mjs',
            'resources\app\server\server.mjs',
            'resources\app\app\world-runtime.js',
            'resources\app\app\v010.js',
            'resources\app\app\app.js'
          )
          foreach($relative in $required){if(-not(Test-Path (Join-Path $output $relative) -PathType Leaf)){throw "Missing packaged file: $relative"}}
          $packaged=(Get-Content (Join-Path $output 'source-commit') -Raw).Trim()
          $head=(git rev-parse HEAD).Trim()
          if($packaged -ne $head){throw "Packaged source $packaged does not match $head."}
          if($head -ne '${{ needs.integrate-and-verify.outputs.commit_sha }}'){throw 'Windows package was not built from the verified source commit.'}

      - name: Validate packaged Sun/Moon authority and clean restart persistence
        shell: pwsh
        run: |
          $output=Join-Path $PWD 'dist\OmniForge-win32-x64'
          $runtime=Join-Path $env:TEMP "omniforge-phase0-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $port=43131
          $env:OMNIFORGE_DATA_ROOT=$runtime
          $env:OMNIFORGE_PORT="$port"

          function Wait-Health {
            $deadline=(Get-Date).AddSeconds(40)
            while((Get-Date)-lt $deadline){Start-Sleep -Milliseconds 400;try{return Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2}catch{}}
            throw 'Packaged executable did not become healthy.'
          }
          function Wait-PortClosed {
            $deadline=(Get-Date).AddSeconds(18)
            while((Get-Date)-lt $deadline){try{Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 1 | Out-Null}catch{return};Start-Sleep -Milliseconds 300}
            throw 'Runtime server did not release its port after clean close.'
          }
          function Close-Cleanly([System.Diagnostics.Process]$AppProcess) {
            if($AppProcess -and -not $AppProcess.HasExited){
              $null=$AppProcess.CloseMainWindow()
              if(-not $AppProcess.WaitForExit(15000)){throw 'OmniForge did not complete a clean window close within 15 seconds.'}
            }
            Wait-PortClosed
          }
          function Force-Cleanup {
            Get-Process OmniForge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process electron -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            try{Wait-PortClosed}catch{}
          }
          function Authority($state) {
            $scene=$state.scenes | Where-Object {$_.id -eq $state.activeSceneId} | Select-Object -First 1
            $suns=@($scene.objects | Where-Object {$_.properties.celestialRole -eq 'sun'})
            $moons=@($scene.objects | Where-Object {$_.properties.celestialRole -eq 'moon'})
            if($suns.Count -ne 1 -or $moons.Count -ne 1){throw "Invalid celestial counts: Sun=$($suns.Count), Moon=$($moons.Count)."}
            if(-not $suns[0].properties.celestialProxy -or -not $moons[0].properties.celestialProxy){throw 'Celestial proxy markers are missing.'}
            if(-not $suns[0].locked -or -not $moons[0].locked){throw 'Celestial proxies are not protected.'}
            return @{Sun=$suns[0];Moon=$moons[0]}
          }

          $process=$null
          try{
            $process=Start-Process -FilePath (Join-Path $output 'OmniForge.exe') -PassThru
            Wait-Health | Out-Null
            $initial=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/state" -TimeoutSec 8
            $authority=Authority $initial

            $legacy=@{type='directionalLight';name='Sun';position=@(0,15,0)} | ConvertTo-Json -Depth 8
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$port/api/object" -ContentType 'application/json' -Body $legacy -TimeoutSec 8 | Out-Null
            $world=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/v010/world" -TimeoutSec 8
            $authority=Authority $world.state

            foreach($bodyObject in @($authority.Sun,$authority.Moon)){
              $selection=@{objectId=$bodyObject.id}|ConvertTo-Json
              Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$port/api/selection" -ContentType 'application/json' -Body $selection -TimeoutSec 8 | Out-Null
            }

            $rejected=$false
            try{
              $duplicate=@{objectId=$authority.Moon.id}|ConvertTo-Json
              Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$port/api/object/duplicate" -ContentType 'application/json' -Body $duplicate -TimeoutSec 8 | Out-Null
            }catch{$rejected=$true}
            if(-not $rejected){throw 'Celestial proxy duplication was not blocked.'}

            Close-Cleanly $process
            $process=$null
            $lifecycle=Get-Content (Join-Path $runtime 'sessions\lifecycle.json') -Raw | ConvertFrom-Json
            if($lifecycle.cleanShutdown -ne $true){throw 'The packaged editor did not record a clean shutdown.'}

            $process=Start-Process -FilePath (Join-Path $output 'OmniForge.exe') -PassThru
            Wait-Health | Out-Null
            $reloaded=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/state" -TimeoutSec 8
            $persisted=Authority $reloaded
            $selection=@{objectId=$persisted.Moon.id}|ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$port/api/selection" -ContentType 'application/json' -Body $selection -TimeoutSec 8 | Out-Null
            Write-Host 'Packaged celestial authority, legacy deduplication, selection, clean close, and restart persistence passed.'
            Close-Cleanly $process
            $process=$null
          }finally{
            Force-Cleanup
            Remove-Item Env:OMNIFORGE_DATA_ROOT -ErrorAction SilentlyContinue
            Remove-Item Env:OMNIFORGE_PORT -ErrorAction SilentlyContinue
            Remove-Item $runtime -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Archive verified Windows build
        shell: pwsh
        run: |
          $archive=Join-Path $PWD 'OmniForge-Phase0-Celestial-Stabilization-Windows-x64.zip'
          if(Test-Path $archive){Remove-Item $archive -Force}
          Compress-Archive -Path '.\dist\OmniForge-win32-x64\*' -DestinationPath $archive -CompressionLevel Optimal
          $hash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OmniForge-Phase0-Celestial-Stabilization-Windows-x64.zip" | Set-Content '.\OmniForge-Phase0-Celestial-Stabilization-Windows-x64.sha256' -Encoding ascii
          Write-Host "Archive SHA-256: $hash"

      - name: Upload verified Windows build
        uses: actions/upload-artifact@v4
        with:
          name: OmniForge-Phase0-Celestial-Stabilization-${{ github.run_id }}
          path: |
            OmniForge-Phase0-Celestial-Stabilization-Windows-x64.zip
            OmniForge-Phase0-Celestial-Stabilization-Windows-x64.sha256
          if-no-files-found: error
          retention-days: 30
