name: Verify OmniForge Source

on:
  push:
    branches:
      - main
      - "milestone-**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout authoritative branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Detect source
        id: source
        shell: pwsh
        run: |
          if (Test-Path package.json) {
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Host "OmniForge source has not been imported yet; repository tooling only."
          }

      - name: Set up Node.js
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.source.outputs.present == 'true'
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Verify source and tests
        id: verify_source
        if: steps.source.outputs.present == 'true'
        shell: pwsh
        run: |
          $stdout = Join-Path $PWD "windows-verify.stdout.log"
          $stderr = Join-Path $PWD "windows-verify.stderr.log"
          $combined = Join-Path $PWD "WINDOWS_VERIFY_ERROR.txt"
          $process = Start-Process npm.cmd -ArgumentList @("run", "verify", "--if-present") -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          @(
            "OmniForge Windows verification exit code: $($process.ExitCode)"
            "Generated: $(Get-Date -Format o)"
            ""
            "--- STDOUT ---"
            (Get-Content $stdout -Raw -ErrorAction SilentlyContinue)
            ""
            "--- STDERR ---"
            (Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
          ) | Set-Content $combined -Encoding UTF8
          Get-Content $combined
          "exit_code=$($process.ExitCode)" >> $env:GITHUB_OUTPUT

      - name: Audit packaged workers
        if: steps.source.outputs.present == 'true' && steps.verify_source.outputs.exit_code == '0'
        shell: pwsh
        run: |
          $registered = @()
          if (Test-Path workers) {
            $registered = Get-ChildItem workers -File -Recurse
          }
          Write-Host "Worker files found: $($registered.Count)"
          if ($registered.Count -lt 1) {
            throw "No packaged worker files were found."
          }
          $builder = Get-Content BUILD_DESKTOP_WINDOWS.ps1 -Raw
          if ($builder -notmatch "'workers'") {
            throw "The Windows desktop builder does not package the workers directory."
          }
          Write-Host "Windows packaging includes the worker registry."

      - name: Commit Windows failure diagnostics
        if: steps.source.outputs.present == 'true' && steps.verify_source.outputs.exit_code != '0'
        shell: pwsh
        run: |
          git config user.name "OmniForge Windows Verifier"
          git config user.email "omniforge-windows-verifier@users.noreply.github.com"
          git add WINDOWS_VERIFY_ERROR.txt
          git commit -m "Record Windows v0.10 verification diagnostics"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Upload Windows verification diagnostics
        if: always() && steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification-${{ github.run_id }}
          path: |
            WINDOWS_VERIFY_ERROR.txt
            windows-verify.stdout.log
            windows-verify.stderr.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when Windows verification failed
        if: steps.source.outputs.present == 'true' && steps.verify_source.outputs.exit_code != '0'
        shell: pwsh
        run: throw "OmniForge Windows verification failed. See WINDOWS_VERIFY_ERROR.txt."
