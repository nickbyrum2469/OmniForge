name: Verify OmniForge Source

on:
  push:
    branches:
      - main
      - "milestone-**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase1b:
    if: github.actor != 'github-actions[bot]' && github.event_name == 'pull_request' && github.head_ref == 'phase1b/lunar-cycle-hdr-lighting-presets'
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Check out exact Phase 1B branch
        uses: actions/checkout@v4
        with:
          ref: phase1b/lunar-cycle-hdr-lighting-presets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        shell: pwsh
        run: if (Test-Path package-lock.json) { npm ci } else { npm install --no-audit --no-fund }
      - name: Run authoritative Phase 1B integration and Windows gate
        shell: pwsh
        run: .\scripts\run-phase1b-ci.ps1
      - name: Upload exact Phase 1B package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OmniForge-Phase1B-Lunar-HDR-${{ github.run_id }}
          path: |
            OmniForge-Phase1B-Lunar-HDR-Windows-x64.zip
            OmniForge-Phase1B-Lunar-HDR-Windows-x64.sha256
            PHASE1B_WINDOWS_EVIDENCE.txt
            PHASE1B_IDEMPOTENCY_DIFF.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload Phase 1B failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OmniForge-Phase1B-failure-${{ github.run_id }}
          path: |
            PHASE1B_TEST_OUTPUT.txt
            PHASE1B_VERIFY_OUTPUT.txt
            PHASE1B_IDEMPOTENCY_DIFF.txt
          if-no-files-found: warn
          retention-days: 14

  verify:
    if: github.actor != 'github-actions[bot]' && !(github.event_name == 'pull_request' && github.head_ref == 'phase1b/lunar-cycle-hdr-lighting-presets')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 24
      - name: Install and verify ordinary source
        if: hashFiles('package.json') != ''
        shell: pwsh
        run: |
          if(Test-Path package-lock.json){npm ci}else{npm install}
          npm run verify --if-present
