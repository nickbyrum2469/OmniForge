name: Verify OmniForge Source

on:
  push:
    branches:
      - main
      - "milestone-**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect source
        id: source
        shell: pwsh
        run: |
          if (Test-Path package.json) {
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Host "OmniForge source has not been imported yet; repository tooling only."
          }

      - name: Set up Node.js
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.source.outputs.present == 'true'
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Verify source and tests
        if: steps.source.outputs.present == 'true'
        shell: pwsh
        run: |
          $stdout = Join-Path $PWD "windows-verify.stdout.log"
          $stderr = Join-Path $PWD "windows-verify.stderr.log"
          $process = Start-Process npm.cmd -ArgumentList @("run", "verify", "--if-present") -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($process.ExitCode -ne 0) { throw "OmniForge verification failed with exit code $($process.ExitCode)." }

      - name: Audit packaged workers
        if: steps.source.outputs.present == 'true'
        shell: pwsh
        run: |
          $registered = @()
          if (Test-Path workers) {
            $registered = Get-ChildItem workers -File -Recurse
          }
          Write-Host "Worker files found: $($registered.Count)"
          if ($registered.Count -lt 1) {
            throw "No packaged worker files were found."
          }
          $builder = Get-Content BUILD_DESKTOP_WINDOWS.ps1 -Raw
          if ($builder -notmatch "'workers'") {
            throw "The Windows desktop builder does not package the workers directory."
          }
          Write-Host "Windows packaging includes the worker registry."

      - name: Upload Windows verification diagnostics
        if: always() && steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification-${{ github.run_id }}
          path: |
            windows-verify.stdout.log
            windows-verify.stderr.log
          if-no-files-found: warn
          retention-days: 7
