name: Targeted v0.11 repair runner

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.head_ref == 'fix/v011-viewport-camera-path-continuity'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply source repair
        run: node scripts/apply-v011-viewport-fix.mjs

      - name: Run automated tests
        run: npm test

      - name: Run repository verification
        run: npm run verify

      - name: Commit verified repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repair is already applied."
            exit 0
          fi
          git config user.name "OmniForge CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/app.js app/renderer.js app/viewport-state.js app/path-visuals.js tests/viewport-camera-path-continuity.test.mjs scripts/apply-v011-viewport-fix.mjs
          git commit -m "Fix viewport camera authority and continuous path guides"
          git push origin HEAD:${{ github.head_ref }}
