name: Build OmniForge v0.11 Windows

on:
  push:
    branches:
      - milestone-11/terrain-path-world-foundation
    paths:
      - app/**
      - server/**
      - bridge/**
      - desktop/**
      - workers/**
      - tests/**
      - package.json
      - BUILD_DESKTOP_WINDOWS.ps1
      - .github/workflows/build-v011-windows.yml
  pull_request:
    branches:
      - milestone-10/foliage-lighting-foundation
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omniforge-v011-windows
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout authoritative v0.11 branch
        uses: actions/checkout@v4
        with:
          ref: milestone-11/terrain-path-world-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Verify source and all connected systems
        shell: pwsh
        run: |
          $stdout=Join-Path $PWD 'v011-package-verify.stdout.log'
          $stderr=Join-Path $PWD 'v011-package-verify.stderr.log'
          $process=Start-Process npm.cmd -ArgumentList @('run','verify') -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if(Test-Path $stdout){Get-Content $stdout}
          if(Test-Path $stderr){Get-Content $stderr}
          if($process.ExitCode -ne 0){throw "v0.11 verification failed with exit code $($process.ExitCode)."}

      - name: Build Windows desktop package
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\BUILD_DESKTOP_WINDOWS.ps1

      - name: Audit packaged v0.11 authorities
        shell: pwsh
        run: |
          $output=Join-Path $PWD 'dist\OmniForge-win32-x64'
          $required=@(
            'OmniForge.exe',
            'version',
            'resources\app\server\v011-bootstrap.mjs',
            'resources\app\server\v011-api.mjs',
            'resources\app\server\v011-systems.mjs',
            'resources\app\app\worldgen.js',
            'resources\app\app\v011.js',
            'resources\app\app\v011.css',
            'resources\app\bridge\v011-tools.mjs',
            'resources\app\workers\local-worker.mjs'
          )
          foreach($relative in $required){if(-not(Test-Path (Join-Path $output $relative) -PathType Leaf)){throw "Packaged v0.11 file is missing: $relative"}}
          $version=Get-Content (Join-Path $output 'version') -Raw
          if($version -notmatch 'OmniForge 0\.11\.0'){throw 'Packaged version marker is not v0.11.0.'}
          $package=Get-Content (Join-Path $output 'resources\app\package.json') -Raw | ConvertFrom-Json
          if($package.version -ne '0.11.0' -or $package.main -ne 'desktop/main.cjs'){throw 'Packaged v0.11 metadata is invalid.'}

      - name: Smoke-test packaged executable, worldgen, atmosphere, and worker
        shell: pwsh
        run: |
          $output=Join-Path $PWD 'dist\OmniForge-win32-x64'
          $runtime=Join-Path $env:TEMP "omniforge-v011-smoke-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $port=43129
          $env:OMNIFORGE_DATA_ROOT=$runtime
          $env:OMNIFORGE_PORT="$port"
          $process=Start-Process -FilePath (Join-Path $output 'OmniForge.exe') -PassThru
          try{
            $health=$null;$deadline=(Get-Date).AddSeconds(30)
            while((Get-Date)-lt $deadline -and -not $health){Start-Sleep -Milliseconds 500;try{$health=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2}catch{}}
            if(-not $health){throw 'Packaged v0.11 did not expose its health endpoint.'}
            if($health.version -ne '0.11.0'){throw "Packaged health reported $($health.version)."}
            $worldgen=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/v011/worldgen" -TimeoutSec 8
            if($worldgen.foundation.terrainSchemaVersion -ne 2 -or -not $worldgen.terrain){throw 'Packaged worldgen authority did not initialize.'}
            $world=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/v010/world" -TimeoutSec 8
            if($world.world.schemaVersion -ne 1){throw 'Packaged v0.10 atmosphere authority regressed.'}
            if(-not $world.runtimeDiagnostics.workers.local.ready){throw 'Packaged Marketplace/background worker is unavailable.'}
            Write-Host 'Packaged v0.11 executable, terrain, splines, atmosphere, foliage foundation, and worker passed.'
          }finally{
            if($process -and -not $process.HasExited){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
            Get-Process OmniForge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item Env:OMNIFORGE_DATA_ROOT -ErrorAction SilentlyContinue
            Remove-Item Env:OMNIFORGE_PORT -ErrorAction SilentlyContinue
            Remove-Item $runtime -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Create portable archive and checksum
        shell: pwsh
        run: |
          $archive=Join-Path $PWD 'OmniForge-3D-Engine-v0.11.0-Windows-x64.zip'
          if(Test-Path $archive){Remove-Item $archive -Force}
          Compress-Archive -Path '.\dist\OmniForge-win32-x64\*' -DestinationPath $archive -CompressionLevel Optimal
          $hash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OmniForge-3D-Engine-v0.11.0-Windows-x64.zip" | Set-Content '.\OmniForge-3D-Engine-v0.11.0-Windows-x64.sha256' -Encoding ascii
          Write-Host "Archive SHA-256: $hash"

      - name: Upload OmniForge v0.11 Windows package
        uses: actions/upload-artifact@v4
        with:
          name: OmniForge-3D-Engine-v0.11.0-Windows-x64
          path: |
            OmniForge-3D-Engine-v0.11.0-Windows-x64.zip
            OmniForge-3D-Engine-v0.11.0-Windows-x64.sha256
          if-no-files-found: error
          retention-days: 30
